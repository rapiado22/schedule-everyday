<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Anchor: routine tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#E9F0EE;--card:#fff;--ink:#12302B;--mute:#5B726D;--line:#CBDAD6;--accent:#1F6B58;--sun:#F2B544;--baby:#7BA7D9;--ex:#E4572E;--work:#1F6B58;--self:#9B7BC9;--rest:#8AA39D;--learn:#D9A23B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0E1B19;--card:#162825;--ink:#E3EFEC;--mute:#92ADA7;--line:#274039;--accent:#5CC4A6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E1B19;--card:#162825;--ink:#E3EFEC;--mute:#92ADA7;--line:#274039;--accent:#5CC4A6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:28px;margin:8px 0 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;margin:28px 0 10px;font-weight:600}
nav{display:flex;gap:6px;margin:16px 0;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--line)}
nav a{flex:1;text-align:center;padding:10px;border-radius:9px;text-decoration:none;color:var(--mute);font-weight:600}
nav a.on{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;justify-content:space-between}
.dn{display:flex;align-items:center;gap:8px;margin-top:6px}
.dn button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;font-weight:800}
.blk{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.blk.now{box-shadow:0 0 0 3px var(--sun)}
.blk.ok .t{text-decoration:line-through;color:var(--mute)}
.blk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.tm{font-weight:600;min-width:52px;color:var(--mute);font-variant-numeric:tabular-nums}
.tag{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row input[type=text],textarea,input[type=number]{flex:1;width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.score{display:flex;align-items:baseline;gap:10px;margin:8px 0}
.score b{font-size:72px;line-height:1;font-weight:800;letter-spacing:-.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{color:var(--mute);font-size:14px}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute)}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px}
.bar.t i{background:var(--sun)}
ul.ins{margin:0;padding-left:20px}
ul.ins li{margin-bottom:6px}
.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.ring{transition:background .3s}}
</style>
</head>
<body>
<main>
<h1>Daily Anchor</h1>
<div class="tag">12 PM to 9 PM shift · baby · exercise · work growth</div>
<nav><a href="#today" id="n1">Today</a><a href="#results" id="n2">Results</a></nav>
<div id="app"></div>
</main>
<script>
const B=[
["06:30","Wake up, feed and play with the baby","baby"],
["07:30","Breakfast and the baby’s morning routine","baby"],
["08:30","Exercise (or stroller walk)","ex"],
["09:30","Shower, get ready, quick chores","self"],
["10:30","Baby time: play, outing, lunch","baby"],
["11:30","Hand off baby, settle at your desk","work"],
["12:00","Clock in on time, pick top 3, then deep work","work"],
["15:00","Break: dinner and a call to the baby","rest"],
["15:30","Customer calls, meetings, follow-ups","work"],
["19:30","Buffer and ticket cleanup","work"],
["20:30","Handoff notes, plan tomorrow’s top 3","work"],
["21:00","Decompress and partner time","self"],
["22:00","Learn 20 minutes, then wind down","learn"],
["23:00","Sleep","rest"]
].map((b,i)=>({id:"b"+i,t:b[0],l:b[1],c:b[2]}));
const CAT={baby:"Baby",ex:"Exercise",work:"Work",self:"You",rest:"Rest",learn:"Learning"};
const K="daily-anchor-v1";
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
let cur=new Date();
const D=k=>S[k]||(S[k]={done:{},sleep:"",top:["","",""],topd:[false,false,false],note:""});
const pct=k=>{const d=S[k];return d?Math.round(B.filter(b=>d.done[b.id]).length/B.length*100):0};
const hm=t=>{const[a,b]=t.split(":");return +a*60+ +b};

function today(){
 const k=iso(cur),d=D(k),p=pct(k),n=new Date(),isT=k===iso(n),nm=n.getHours()*60+n.getMinutes();
 let nowId=null;if(isT)B.forEach(b=>{if(hm(b.t)<=nm)nowId=b.id});
 const label=cur.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
 return `<div class="top"><div><div style="font-size:22px;font-weight:600">${label}</div>
 <div class="dn"><button data-nav="-1" aria-label="Previous day">‹</button><button data-nav="1" aria-label="Next day">›</button><button data-nav="0" style="width:auto;padding:0 12px;font-size:14px">Today</button></div></div>
 <div class="ring" style="--p:${p}"><b>${p}%</b></div></div>
 <h2>Schedule</h2>
 ${B.map(b=>`<label class="blk ${d.done[b.id]?"ok":""} ${b.id===nowId?"now":""}" style="--c:var(--${b.c})"><input type="checkbox" data-b="${b.id}" ${d.done[b.id]?"checked":""}><span class="tm">${b.t}</span><span><span class="t">${b.l}</span><br><span class="tag">${CAT[b.c]}${b.id===nowId?" · happening now":""}</span></span></label>`).join("")}
 <h2>Top 3 tickets</h2><div class="card">
 ${[0,1,2].map(i=>`<div class="row"><input type="checkbox" data-td="${i}" ${d.topd[i]?"checked":""} aria-label="Ticket ${i+1} done"><input type="text" data-tt="${i}" value="${esc(d.top[i])}" placeholder="Ticket or task ${i+1}"></div>`).join("")}</div>
 <h2>End of day</h2><div class="card">
 <div class="row"><label for="sl">Hours slept last night</label><input id="sl" type="number" min="0" max="14" step="0.5" value="${esc(d.sleep)}" style="max-width:100px"></div>
 <textarea id="nt" rows="3" placeholder="One win, one lesson (add it to your knowledge base)">${esc(d.note)}</textarea></div>`;
}

function results(){
 const days=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push(iso(x))}
 const ds=days.map(k=>S[k]||null);
 const avg=Math.round(days.reduce((a,k)=>a+pct(k),0)/7);
 const exB=B.find(b=>b.c==="ex").id;
 const ex=ds.filter(d=>d&&d.done[exB]).length;
 const t3=ds.reduce((a,d)=>a+(d?d.topd.filter(Boolean).length:0),0);
 const sl=ds.map(d=>d&&parseFloat(d.sleep)).filter(v=>v>0);
 const slAvg=sl.length?(sl.reduce((a,b)=>a+b,0)/sl.length):0;
 const lrB=B.find(b=>b.c==="learn").id;
 const lr=ds.filter(d=>d&&d.done[lrB]).length;
 let streak=0;for(let i=days.length-1;i>=0;i--){if(pct(days[i])>=70)streak++;else break}
 const score=Math.round(avg*.5+Math.min(ex/3,1)*20+Math.min(t3/15,1)*20+(slAvg?Math.min(slAvg/7,1)*10:0));
 const ins=[];
 ins.push(ex>=3?`Exercise is on track (${ex} sessions). Keep the 8:30 slot.`:`Exercise is behind (${ex} of 3 to 4). Book a backup slot at 9:30 or after 9 PM.`);
 if(slAvg&&slAvg<7)ins.push(`Sleep averages ${slAvg.toFixed(1)} h. Move wind-down earlier before cutting anything else.`);
 if(t3<10)ins.push(`Only ${t3} of 21 top-3 tickets done. Pick smaller, high-impact tickets right after you clock in.`);
 if(lr<3)ins.push(`Learning happened ${lr} times. Try 20 minutes right after your 3 PM break instead of late night.`);
 if(avg>=70)ins.push("Routine is holding. Protect the buffer blocks, since they make this sustainable.");
 const note=ds.filter(d=>d&&d.note).slice(-3).reverse().map(d=>`<li>${esc(d.note)}</li>`).join("");
 return `<h2 style="margin-top:8px">Last 7 days</h2>
 <div class="card"><div class="tag">Week score</div><div class="score"><b>${score}</b><span class="tag">out of 100</span></div>
 <div class="tag">Routine 50% · exercise 20% · top-3 tickets 20% · sleep 10%</div></div>
 <h2>Daily completion</h2><div class="card"><div class="bars">${days.map((k,i)=>{const p=pct(k),dt=new Date(k+"T00:00");return `<div class="bar ${i===6?"t":""}"><span>${p}%</span><i style="height:${p*1.1}px"></i><span>${dt.toLocaleDateString(undefined,{weekday:"short"})}</span></div>`}).join("")}</div></div>
 <h2>Key numbers</h2><div class="grid">
 <div class="card stat"><b>${avg}%</b><span>Average completion</span></div>
 <div class="card stat"><b>${ex}/4</b><span>Exercise sessions</span></div>
 <div class="card stat"><b>${t3}/21</b><span>Top-3 tickets done</span></div>
 <div class="card stat"><b>${slAvg?slAvg.toFixed(1)+" h":"–"}</b><span>Average sleep</span></div>
 <div class="card stat"><b>${lr}/3</b><span>Learning sessions</span></div>
 <div class="card stat"><b>${streak}</b><span>Day streak (70% or more)</span></div></div>
 <h2>What to adjust</h2><div class="card"><ul class="ins">${ins.map(i=>`<li>${i}</li>`).join("")}</ul></div>
 <h2>Recent wins and lessons</h2><div class="card">${note?`<ul class="ins">${note}</ul>`:'<span class="tag">Write a daily note on the Today tab and it will show up here.</span>'}</div>
 <h2>Friday review</h2><div class="card tag">Which tickets took longest? Which repeated? What can you document or automate next week?</div>
 <p><button class="btn" id="rs">Clear all data</button></p>`;
}

function render(){
 const r=location.hash==="#results";
 document.getElementById("n1").className=r?"":"on";document.getElementById("n2").className=r?"on":"";
 document.getElementById("app").innerHTML=r?results():today();
}
document.addEventListener("change",e=>{
 const t=e.target,d=D(iso(cur));
 if(t.dataset.b){d.done[t.dataset.b]=t.checked;save();render()}
 else if(t.dataset.td){d.topd[+t.dataset.td]=t.checked;save()}
 else if(t.id==="sl"){d.sleep=t.value;save()}
});
document.addEventListener("input",e=>{
 const t=e.target,d=D(iso(cur));
 if(t.dataset.tt){d.top[+t.dataset.tt]=t.value;save()}
 else if(t.id==="nt"){d.note=t.value;save()}
});
document.addEventListener("click",e=>{
 const n=e.target.closest("[data-nav]");
 if(n){const v=+n.dataset.nav;if(v===0)cur=new Date();else cur.setDate(cur.getDate()+v);render()}
 if(e.target.id==="rs"&&confirm("Delete all tracked days?")){S={};save();render()}
});
window.addEventListener("hashchange",render);
render();setInterval(()=>{if(location.hash!=="#results"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA")render()},60000);
</script>
</body>
</html>
